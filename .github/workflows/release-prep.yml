name: release-prep (reusable)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      changelog-range:
        description: "Optional git-cliff commit range lower bound, e.g. 'v1.0.7..' to exclude older history"
        required: false
        type: string
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version input
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::'${{ inputs.version }}' does not match vX.Y.Z, vX.Y.ZrcN or vX.Y.Z.devN"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Check tag does not already exist
        run: |
          if git rev-parse ${{ inputs.version }} >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists"
            exit 1
          fi
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update CHANGELOG.md
        if: ${{ !contains(inputs.version, 'rc') && !contains(inputs.version, '.dev') }}
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ inputs.changelog-range }} --tag ${{ inputs.version }}
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit CHANGELOG.md
        if: ${{ !contains(inputs.version, 'rc') && !contains(inputs.version, '.dev') }}
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ inputs.version }}"
          git push origin HEAD:master
      - name: Create and push tag
        run: |
          git tag -a ${{ inputs.version }} -m "${{ inputs.version }}"
          git push origin ${{ inputs.version }}
