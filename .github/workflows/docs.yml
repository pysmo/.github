name: Documentation (reusable)

on:
  workflow_call:
    inputs:
      extra-build-command:
        description: "Optional shell command to run after installing docs dependencies, before building the site"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install docs dependencies
        run: |
          uv sync --locked --no-dev --group docs
      - name: Run extra build command
        if: inputs.extra-build-command != ''
        run: ${{ inputs.extra-build-command }}
      - name: Build site
        run: uv run zensical build --clean
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
