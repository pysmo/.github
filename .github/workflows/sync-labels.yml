name: Sync Organization Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC

jobs:
  discover-repos:
    name: Discover Org Repositories
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.get-repos.outputs.repos }}
    steps:
      - name: List active repositories in pysmo
        id: get-repos
        env:
          GH_TOKEN: ${{ secrets.ORG_LABELS_TOKEN || github.token }}
        run: |
          REPOS=$(gh repo list pysmo --no-archived --limit 100 --json nameWithOwner --jq '[.[].nameWithOwner]')
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

  sync-labels:
    name: Sync Labels
    needs: discover-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover-repos.outputs.repos) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync labels to ${{ matrix.repo }}
        uses: EndBug/label-sync@v2
        with:
          token: ${{ secrets.ORG_LABELS_TOKEN || github.token }}
          config-file: .github/labels.yml
          repository: ${{ matrix.repo }}
          delete-other-labels: false
