name: Manage Stale Issues and PRs

on:
    workflow_call:
        inputs:
            days-before-stale:
                description: "Number of days of inactivity before marking as stale (-1 to disable)"
                required: false
                type: number
                default: 60
            days-before-close:
                description: "Number of days of inactivity after being marked stale before closing (-1 to disable)"
                required: false
                type: number
                default: 14
            exempt-labels:
                description: "Comma-separated list of labels exempt from stale management"
                required: false
                type: string
                default: "pinned,keep-open,accepted,triaged,security,blocked"
    schedule:
        - cron: "0 3 * * *" # Daily at 03:00 UTC
    workflow_dispatch:

permissions:
    issues: write
    pull-requests: write

jobs:
    stale:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/stale@v9
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

                  # Timing configuration
                  days-before-issue-stale: ${{ inputs.days-before-stale != '' && inputs.days-before-stale || 60 }}
                  days-before-issue-close: ${{ inputs.days-before-close != '' && inputs.days-before-close || 14 }}
                  days-before-pr-stale: ${{ inputs.days-before-stale != '' && inputs.days-before-stale || 60 }}
                  days-before-pr-close: ${{ inputs.days-before-close != '' && inputs.days-before-close || 14 }}

                  # Label definitions
                  stale-issue-label: "stale"
                  stale-pr-label: "stale"
                  exempt-issue-labels: ${{ inputs.exempt-labels != '' && inputs.exempt-labels || 'pinned,keep-open,accepted,triaged,security,blocked' }}
                  exempt-pr-labels: ${{ inputs.exempt-labels != '' && inputs.exempt-labels || 'pinned,keep-open,accepted,triaged,security,blocked' }}

                  # Exclude items assigned to milestones or users
                  exempt-all-issue-milestones: true
                  exempt-all-pr-milestones: true
                  exempt-all-issue-assignees: true
                  exempt-all-pr-assignees: true

                  # Messages
                  stale-issue-message: >
                      This issue has been automatically marked as stale because it has not had
                      recent activity. It will be closed in 14 days if no further activity occurs.
                      If this issue is still relevant, please add a comment or update to keep it open.
                  stale-pr-message: >
                      This pull request has been automatically marked as stale because it has not had
                      recent activity. It will be closed in 14 days if no further activity occurs.
                      If this PR is still relevant, please add a comment or push new commits to keep it open.
                  close-issue-message: >
                      This issue was closed automatically because it has been inactive for 14 days
                      since being marked as stale.
                  close-pr-message: >
                      This pull request was closed automatically because it has been inactive for 14 days
                      since being marked as stale.

                  # Order by least recently updated to prevent API rate-limit spikes
                  operations-per-run: 30
                  ascending: true
